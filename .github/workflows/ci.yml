name: Storefront CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Avoid wasting runners on superseded commits in the same branch/PR.
concurrency:
  group: storefront-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Type-check and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check TypeScript
        run: npx tsc --noEmit

      - name: Build storefront
        run: npm run build
